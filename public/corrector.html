<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <title>Corrector de texto</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            margin: 0;
            padding: 0;
            background: #f3f4f6;
            color: #111827;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            background: #ffffff;
            padding: 1.75rem;
            border-radius: 0.75rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 800px;
        }

        h1 {
            margin: 0 0 1rem;
            font-size: 1.5rem;
            text-align: center;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        textarea {
            width: 100%;
            min-height: 150px;
            padding: 0.75rem;
            border-radius: 0.5rem;
            border: 1px solid #d1d5db;
            resize: vertical;
            font-family: inherit;
            font-size: 0.95rem;
            box-sizing: border-box;
        }

        textarea:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 1px #2563eb33;
        }

        .actions {
            margin-top: 1rem;
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        button {
            border: none;
            border-radius: 999px;
            padding: 0.6rem 1.2rem;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            background: #2563eb;
            color: white;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            transition: background 0.15s ease, transform 0.05s ease;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:active {
            transform: translateY(1px);
        }

        button[disabled] {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status {
            font-size: 0.85rem;
            color: #6b7280;
        }

        .output-block {
            margin-top: 1.5rem;
        }

        .output-label {
            font-weight: 600;
            margin-bottom: 0.4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .output {
            background: #f9fafb;
            border-radius: 0.5rem;
            padding: 0.75rem;
            border: 1px solid #e5e7eb;
            min-height: 80px;
            white-space: pre-wrap;
        }

        .error {
            color: #b91c1c;
            margin-top: 0.5rem;
            font-size: 0.85rem;
        }

        .copy-btn {
            border-radius: 999px;
            padding: 0.3rem 0.8rem;
            font-size: 0.8rem;
            background: #10b981;
        }

        .copy-btn:hover {
            background: #059669;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Corrector de texto</h1>

        <form id="corrector-form">
            <div>
                <label for="texto">Texto a corregir</label>
                <textarea id="texto" name="texto" placeholder="Escribe aquí el texto que deseas corregir..."
                    required></textarea>
            </div>

            <div class="actions">
                <button type="submit" id="btn-corregir">
                    <span>Corregir texto</span>
                </button>
                <span class="status" id="estado"></span>
            </div>
            <div class="error" id="error" style="display:none;"></div>
        </form>

        <div class="output-block" id="resultado-bloque" style="display:none;">
            <div class="output-label">
                <span>Texto corregido</span>
                <button type="button" class="copy-btn" id="btn-copiar">Copiar</button>
            </div>
            <div class="output" id="texto-corregido"></div>
        </div>
    </div>

    <script>
        // Configura aquí la URL de tu API de corrección

        const form = document.getElementById("corrector-form");
        const textarea = document.getElementById("texto");
        const btnCorregir = document.getElementById("btn-corregir");
        const estado = document.getElementById("estado");
        const errorEl = document.getElementById("error");
        const resultadoBloque = document.getElementById("resultado-bloque");
        const textoCorregidoEl = document.getElementById("texto-corregido");
        const btnCopiar = document.getElementById("btn-copiar");

        async function corregirTexto(event) {
            event.preventDefault();
            const textoOriginal = textarea.value.trim();

            errorEl.style.display = "none";
            errorEl.textContent = "";
            resultadoBloque.style.display = "none";
            textoCorregidoEl.textContent = "";

            if (!textoOriginal) {
                errorEl.textContent = "Por favor escribe algún texto para corregir.";
                errorEl.style.display = "block";
                return;
            }

            btnCorregir.disabled = true;
            estado.textContent = "Corrigiendo texto...";

            try {
                const respuesta = await fetch("http://localhost:11434/api/generate", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({
                        model: "qwen2.5:7b", // O llama3
                        prompt: `Corrige únicamente la ortografía y gramática de este texto: "${textoOriginal}". Retorna solo el texto limpio sin comillas dobles, y no capitalices.`,
                        stream: false,
                        options: {
                            temperature: 0,
                            stop: ["\n", "Texto:"] 
                        }
                    })
                });

                if (!respuesta.ok) {
                    throw new Error("Error en la respuesta de la API");
                }

                // Ajusta esto al formato que devuelva tu API
                const data = await respuesta.json();
                // Suponemos que la API devuelve: { corregido: "texto corregido..." }
                const textoCorregido = data.response || "";

                if (!textoCorregido) {
                    throw new Error("La API no devolvió un texto corregido.");
                }

                textoCorregidoEl.textContent = textoCorregido;
                resultadoBloque.style.display = "block";
                estado.textContent = "Texto corregido correctamente.";
            } catch (e) {
                console.error(e);
                errorEl.textContent =
                    "No se pudo corregir el texto. Verifica la API o inténtalo de nuevo más tarde.";
                errorEl.style.display = "block";
                estado.textContent = "";
            } finally {
                btnCorregir.disabled = false;
            }
        }

        async function copiarResultado() {
            const texto = textoCorregidoEl.textContent;
            if (!texto) return;

            try {
                await navigator.clipboard.writeText(texto);
                estado.textContent = "Texto corregido copiado al portapapeles.";
                setTimeout(() => {
                    if (estado.textContent.startsWith("Texto corregido copiado")) {
                        estado.textContent = "";
                    }
                }, 2500);
            } catch (e) {
                console.error(e);
                estado.textContent = "No se pudo copiar el texto.";
            }
        }

        form.addEventListener("submit", corregirTexto);
        btnCopiar.addEventListener("click", copiarResultado);
    </script>
</body>

</html>
